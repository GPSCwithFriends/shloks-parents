function shrinkImage(file, max, cb) {

  rd.onload = function () {
    var img = new Image();
    img.onload = function () {

      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);

    img.src = rd.result;
  };

}

var OFF_WRITES = ['logTask', 'addWater', 'delWater', 'setMeal', 'setMed', 'takeMed', 'addCall', 'delCall', 'setWant', 'addVisit', 'delVisit', 'saveNight', 'addTodo',

    if (OFF_READS.indexOf(action) >= 0) {

      for (var i = 0; i < n; i++) { var s = src[Math.floor(i * ratio)]; pcm[i] = Math.max(-1, Math.min(1, s)) * 0x7FFF; }

      v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);

function runVoiceItem(it) {

    case 'word': return call('shlokAdd', { date: d, type: 'word', value: it.text });
    case 'story': return Promise.all([call('setFamily', { date: d, field: 'storyBy', value: it.by || S.user }), call('setFamily', { date: d, field: 'story', value: it.text })]);
    case 'water': return call('addWater', { date: d, ml: it.ml });

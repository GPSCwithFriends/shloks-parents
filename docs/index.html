<style>
:root{--bg:#F6F3EE;--ink:#1F2A2E;--muted:#5B6468;--line:#E7E1D8;--teal:#0F766E;--terra:#9A3412;--amber:#B45309;--violet:#6D28D9;--blue:#1D4ED8;--rose:#BE123C;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Gujarati','Inter',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:520px;margin:0 auto;min-height:100vh}
.boot{padding:40vh 0;text-align:center;color:var(--muted)}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font-family:inherit;font-size:16px;border:1px solid #D6CFC4;border-radius:10px;padding:10px;color:var(--ink);background:#fff;width:100%}
textarea{resize:none}
a{color:var(--terra)}
.wrap{padding:4px 14px 32px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:15px;font-weight:700}
.row{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.muted{color:var(--muted);font-size:12px}
.small{font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:38px;padding:0 12px;border-radius:19px;border:1px solid #D6CFC4;background:#fff;font-size:13px;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{height:44px;padding:0 16px;border-radius:22px;border:none;background:var(--ink);color:#fff;font-size:14px;font-weight:600}
.btn.teal{background:var(--teal)}.btn.terra{background:var(--terra)}.btn.blue{background:var(--blue)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #D6CFC4}
.btn.wide{width:100%}
.link{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
/* header */
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.brand img{width:40px;height:40px;border-radius:10px}
.brand .name{flex:1;font-family:Inter,sans-serif;font-size:16px;font-weight:700}
.who{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;color:var(--muted);line-height:1.4}
.who button{background:none;border:none;padding:0;color:var(--terra);font-weight:600;text-decoration:underline;font-size:11px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:10px 12px 6px;position:sticky;top:0;background:var(--bg);z-index:5}
.tab{height:42px;border-radius:21px;border:1px solid #E2DBD0;background:#fff;font-size:11.5px;color:var(--ink);white-space:nowrap;padding:0 4px}
.tab.on{background:var(--ink);color:#fff;font-weight:700;border-color:var(--ink)}
.subhead{padding:8px 18px 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.subhead h1{margin:2px 0 0;font-size:23px;font-weight:700}
.lang{display:flex;background:#EAE4DA;border-radius:20px;padding:3px;flex-shrink:0}
.lang button{height:32px;min-width:46px;border:none;border-radius:16px;background:transparent;font-size:13px;font-weight:600;color:var(--ink)}
.lang button.on{background:var(--ink);color:#fff}
.datenav{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.datenav button{width:32px;height:32px;border-radius:16px;border:1px solid #E2DBD0;background:#fff;color:var(--ink)}
/* plan card */
.plan{background:var(--ink);color:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.plan .steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.plan .steps div{height:6px;border-radius:3px;background:rgba(255,255,255,.25)}
.plan .steps div.on{background:#fff}
.plan .soft{font-size:13px;color:#D5DDDF}
.alldone{background:#FFF4EC;color:#7C2D12;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.alldone .meme{font-size:18px;font-weight:800;line-height:1.35}
.alldone .sug{background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--ink)}
.tip{background:#F3EEFB;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#3B1B7A;line-height:1.6}
.tip b{font-size:11px;color:#fff;background:var(--violet);border-radius:8px;padding:3px 7px;flex-shrink:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--muted);padding:0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.readonly{background:#EEF2F3;border-radius:12px;padding:8px 12px;font-size:12px;color:var(--muted)}
/* tasks */
.tasks{background:#fff;border-radius:18px;padding:4px 12px}
.task{display:flex;flex-direction:column;border-top:1px solid #F1EDE6;padding:10px 0;border-radius:10px;transition:background .4s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.task:first-child{border-top:none}
.task.press{background:#F3E8DC}
.task .tline{display:flex;gap:10px;align-items:flex-start}
.task .time{width:44px;flex-shrink:0;padding-top:2px}
.task .time div:first-child{font-size:13px;font-weight:600}
.task .bar{width:26px;height:3px;border-radius:2px;margin-top:3px}
.task .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.task .label{display:flex;gap:6px;align-items:flex-start}
.task .label div{flex:1;font-size:14px;line-height:1.45}
.task .tag{font-size:11px;font-weight:700}
.iconbtn{width:36px;height:32px;flex-shrink:0;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.timechip{font-size:13px;font-weight:600;color:#fff;border:none;border-radius:10px;padding:4px 8px;width:auto}
.skipchip{font-size:12px;font-weight:600;color:#9F1239;background:#FFE4E6;border-radius:10px;padding:3px 9px}
.sheet{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.delbox{background:#FFF7ED;border:1px solid #FDBA74;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:12px;color:#7C2D12;line-height:1.5}
.pending{background:#FFF7ED;border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;color:var(--terra);font-weight:600}
.pin{width:110px!important;letter-spacing:6px;padding:8px 10px}
/* focus */
.overlay{position:fixed;inset:0;background:rgba(20,26,30,.55);z-index:50;display:flex;justify-content:center;padding:60px 12px 0;overflow:auto}
.focus{background:var(--bg);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y;user-select:none;-webkit-user-select:none;box-shadow:0 20px 50px rgba(0,0,0,.25);width:100%;max-width:480px;height:max-content;transition:transform .15s}
.fcard{flex:1;min-width:0;background:#fff;border-radius:22px;padding:20px 16px;display:flex;flex-direction:column;gap:8px;text-align:center;border-top:5px solid}
.round{width:44px;height:44px;flex-shrink:0;border-radius:22px;border:1px solid #D6CFC4;background:#fff;font-size:20px;color:var(--ink);padding:0}
.big{height:58px;border-radius:29px;font-size:17px;font-weight:700}
/* misc cards */
.manifest{background:#FFF8E7}
.manifest textarea{border-color:#F0D9A8;line-height:1.6}
.manifest img{width:100%;max-height:220px;object-fit:cover;border-radius:12px}
.waterbar{height:8px;background:#DBEAFE;border-radius:4px}.waterbar div{height:8px;background:var(--blue);border-radius:4px}
.night{background:#EEF2FF}
.night h3{color:#312E81}
.night .chip{border-color:#A5B4FC;color:#312E81}
.night .chip.on{background:#4F46E5;color:#fff;border-color:#4F46E5}
.energy{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.energy button{height:44px;border-radius:12px;border:1px solid #A5B4FC;background:#fff;color:#312E81;font-size:15px;font-weight:700}
.energy button.on{background:#4F46E5;color:#fff}
.list .li{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;border-top:1px solid #F1EDE6}
.want{height:36px;padding:0 12px;border-radius:18px;border:1px dashed var(--amber);background:#FFF7ED;color:#7C2D12;font-size:12px}
.stat{background:#F6F3EE;border-radius:12px;padding:10px}
.stat div:first-child{font-size:11px;color:var(--muted)}
.stat div:last-child{font-size:18px;font-weight:700}
.pbar{height:6px;background:#EEE9E2;border-radius:3px}.pbar div{height:6px;border-radius:3px}
.chain{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#3B1B7A;line-height:1.55}
.chain div{background:#fff;border-radius:10px;padding:8px 10px}
.chain i{text-align:center;font-style:normal;font-size:12px}
.approvals{background:#FFF4EC}
.todo{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid #F1EDE6}
.box{width:26px;height:26px;border-radius:8px;border:2px solid #B8B0A4;background:#fff;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.box.on{background:var(--teal);border-color:var(--teal)}
.nights{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-items:end}
.nights div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:20px;border:1px solid #D6CFC4;background:#fff;font-size:18px}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;padding:24px 22px 20px;gap:12px}
.login .logo{width:76px;height:76px;border-radius:20px;box-shadow:0 8px 24px rgba(31,42,46,.12)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 22px}
.keys button{height:52px;border-radius:26px;border:none;background:#fff;font-family:Inter,sans-serif;font-size:22px;font-weight:600;color:var(--ink)}
.dots{display:flex;gap:14px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:8px;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
.userbtn{height:64px;border-radius:18px;border:2px solid #E2DBD0;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700;color:var(--ink)}
.userbtn i{width:10px;height:10px;border-radius:5px}
.credit{margin-top:auto;background:#fff;border-radius:20px;padding:14px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;border:1px dashed #D6CFC4}
.stamp{font-family:'Baloo 2',Inter,sans-serif;font-size:12px;font-weight:800;color:var(--terra);border:2px solid var(--terra);border-radius:8px;padding:2px 8px;letter-spacing:.06em;transform:rotate(-8deg);animation:spStamp 3s ease-in-out infinite}
.da{display:inline-block;animation:spBounce 1.6s ease-in-out infinite;font-family:'Baloo 2',Inter,sans-serif;font-weight:800}
@keyframes spBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
@keyframes spStamp{0%,85%,100%{transform:rotate(-8deg) scale(1)}90%{transform:rotate(-8deg) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.da,.stamp{animation:none}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:30px;text-align:center;color:var(--muted)}
</style>

// ------------------------------------------------------------------ actions
function taskById(id) { var d = curDay(); if (!d) return null; for (var i = 0; i < d.tasks.length; i++) if (d.tasks[i].id === id) return d.tasks[i]; return null; }
function idxById(id) { var d = curDay(); for (var i = 0; i < d.tasks.length; i++) if (d.tasks[i].id === id) return i; return -1; }
function advanceFocus(id) { if (S.ui.focus !== null && idxById(id) === S.ui.focus && S.ui.focus < curDay().tasks.length - 1) S.ui.focus++; }
function logTask(x, extra) {
  return call('logTask', Object.assign({ date: S.date, taskId: x.id, status: x.s, actual: x.a || '', reason: x.r || '' }, extra || {})).catch(function (e) { fail(e); loadDay(S.view, true); });
}
function refreshDay() { loadDay(S.view, true); }
function nightState() { var k = S.view + S.date; if (!S.ui.night[k]) S.ui.night[k] = { moods: [], energy: 0, improve: [], tomorrow: '', note: '' }; return S.ui.night[k]; }

var H = {
  go: function (el) { S.view = el.dataset.v; S.ui.focus = null; S.ui.sheet = null; S.ui.delAsk = null; if (S.view === 'report') S.weekStart = weekStart(S.date); loadView(); window.scrollTo(0, 0); },
  logout: function () { var tok = S.token; call('logout', { token: tok }).catch(function () {}); logoutLocal(); },
  lang: function (el) { S.lang = el.dataset.l; ls('sp_lang', S.lang); render(); if (S.token) call('setLang', { lang: S.lang }).catch(function () {}); },
  day: function (el) { S.date = addDays(S.date, +el.dataset.d); if (S.date > today()) S.date = today(); S.ui = freshUi(); loadView(); },
  saveApi: function () {
    var u = String(S.setupUrl !== undefined ? S.setupUrl : apiUrl()).trim().replace(/\/u\/\d+\//, '/');
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(u)) { S.setupMsg = t('setupBad'); render(); return; }
    var prev = ls('sp_api'); ls('sp_api', u); S.busy.api = true; S.setupMsg = ''; render();
    call('ping').then(function () { S.busy.api = false; S.setup = false; S.setupUrl = undefined; render(); })
      .catch(function () { S.busy.api = false; ls('sp_api', prev); S.setupMsg = t('setupFail'); render(); });
  },
  openSetup: function () { S.setup = true; S.setupUrl = apiUrl(); render(); },
  cancelSetup: function () { S.setup = false; S.setupUrl = undefined; render(); },
  pickUser: function (el) { S.login.user = el.dataset.u; S.login.pin = ''; S.login.msg = ''; S.login.msgBad = false; render(); },
  key: function (el) { keyPress(el.dataset.k); },
  done: function (el) { var x = taskById(el.dataset.id); x.s = 'done'; x.a = nowHM(); x.r = ''; S.ui.sheet = null; advanceFocus(x.id); render(); logTask(x); },
  notDone: function (el) { S.ui.sheet = el.dataset.id; S.ui.newReason = ''; render(); },
  reason: function (el) { var x = taskById(el.dataset.id); x.s = 'skip'; x.r = el.dataset.r; x.a = ''; S.ui.sheet = null; advanceFocus(x.id); render(); logTask(x); },
  addReason: function (el) {
    var txt = (S.ui.newReason || '').trim(); if (!txt) return;
    var x = taskById(el.dataset.id), d = curDay();

  },
  undo: function (el) { var x = taskById(el.dataset.id); x.s = 'todo'; x.a = ''; x.r = ''; render(); logTask(x, { qty: '' }); },
  askDel: function (el) { S.ui.delAsk = el.dataset.id; S.ui.pin = ''; S.ui.pinErr = ''; render(); },
  cancelDel: function () { S.ui.delAsk = null; render(); },
  sendDel: function (el) {

      .catch(function (e) { var m = String(e.message); S.ui.pinErr = m.indexOf('BADPIN:') === 0 ? t('badPin', { n: m.split(':')[1] }) : m === 'LOCKED' ? t('locked') : m; render(); });

  ntKind: function (el) { S.ui.nt.kind = el.dataset.k; render(); },

      esc(catName(e.category) + ' · ' + shortDate(e.date) + (e.app ? ' · ' + e.app : '')) + (e.need ? ' · <b style="color:' + tagCol + '">' + esc(t(e.need)) + '</b>' : '') + '</span></span><b style="font-size:14px">' + rs(e.amount) + '</b></button>';
    if (open) h += catSelect('ec-' + e.id, e.category, 'data-ch="expCat" data-id="' + e.id + '" style="padding:8px"') + needChips('expNeed', e.id, e.need) +
      (e.need === 'avoid' ? '<div class="row"><input id="er-' + e.id + '" placeholder="' + esc(t('whyAvoidPh')) + '" value="' + esc(e.reason) + '" data-ch="expReason" data-id="' + e.id + '"></div>' : '') +
      '<button class="link" style="align-self:flex-start;color:#BE123C" data-a="finDel" data-id="' + e.id + '">' + esc(t('del')) + '</button>';
    return h + '</div>';
  }).join('') + '</div>';
  return out + finSettingsCards() + '</div>';
}
function finAddCard() {
  var F = S.fin, f = F.form;
  var h = '<div class="card"><h3>' + esc(t('addT')) + '</h3><div class="grid2">' +
    '<label class="btn terra" style="display:flex;align-items:center;justify-content:center;cursor:pointer" for="finShots">' + esc(t('shotBtn')) + '</label>' +
    '<button class="btn ghost" data-a="finManual">' + esc(t('manualBtn')) + '</button></div>' +
    '<input id="finShots" type="file" accept="image/*" multiple data-ch="finShots" style="position:absolute;width:1px;height:1px;opacity:0">';
  if (F.files.length) {
    h += '<div class="muted" style="line-height:1.6">' + esc(t('shotHint')) + '</div><div class="row" style="flex-wrap:wrap">' + F.files.map(function (u) { return '<img src="' + u + '" alt="" style="width:56px;height:80px;object-fit:cover;border-radius:8px">'; }).join('') + '</div>' +
      '<div class="small">' + esc(t('shotsChosen', { n: F.files.length })) + '</div>' +
      '<select id="finApp" data-ch="finApp"><option value="">' + esc(t('appAuto')) + '</option>' + FAPPS.map(function (a) { return '<option' + (F.app === a ? ' selected' : '') + '>' + a + '</option>'; }).join('') + '</select>' +
      '<div class="row"><button class="btn teal" style="flex:1" data-a="finUpload"' + (F.busy ? ' disabled' : '') + '>' + (F.busy ? '<span class="spin"></span> ' : '') + esc(t('upload')) + '</button><button class="link" data-a="finClearShots">' + esc(t('cancel')) + '</button></div>';
  }
  if (F.manual) {
    h += '<div style="border-top:1px solid #F1EDE6;padding-top:10px;display:flex;flex-direction:column;gap:8px">' +
      '<div class="row"><input id="fAmt" type="number" inputmode="decimal" placeholder="' + esc(t('amount')) + '" value="' + esc(f.amount) + '" data-in="fAmt">' +
      '<input id="fDate" type="date" style="width:160px;flex-shrink:0" aria-label="' + esc(t('date')) + '" value="' + esc(f.date) + '" data-ch="fDate"></div>' +
      catSelect('fCat', f.category, 'data-ch="fCat" aria-label="' + esc(t('category')) + '"') +
      '<input id="fItem" placeholder="' + esc(t('detailsPh')) + '" aria-label="' + esc(t('details')) + '" value="' + esc(f.item) + '" data-in="fItem">' +
      needChips('fNeed', '', f.need) +
      (f.need === 'avoid' ? '<input id="fReason" placeholder="' + esc(t('whyAvoidPh')) + '" aria-label="' + esc(t('whyAvoid')) + '" value="' + esc(f.reason) + '" data-in="fReason">' : '') +
      '<div class="row"><select id="fPaid" data-ch="fPaid" aria-label="' + esc(t('paidBy')) + '">' + ['mehul', 'arpita'].map(function (u) { return '<option value="' + u + '"' + ((f.paidBy || S.user) === u ? ' selected' : '') + '>' + esc(t(u)) + '</option>'; }).join('') + '</select>' +
      '<select id="fMode" data-ch="fMode" aria-label="' + esc(t('mode')) + '">' + ['upi', 'card', 'cash', 'online'].map(function (m) { return '<option value="' + m + '"' + (f.mode === m ? ' selected' : '') + '>' + esc(t('m_' + m)) + '</option>'; }).join('') + '</select></div>' +
      '<button class="btn teal wide" data-a="finSave">' + esc(t('saveExp')) + '</button></div>';
  }
  return h + '</div>';
}
function finSettingsCards() {
  var F = S.fin, d = F.data || { recurring: [] }, r = F.rec;
  var h = '<div class="card"><div class="between"><h3>' + esc(t('budgetT')) + '</h3><button class="link" data-a="finToggle" data-k="showBudget">' + esc(F.showBudget ? t('hide') : t('show')) + '</button></div>';
  if (F.showBudget) h += '<div class="muted">' + esc(t('budgetSub')) + '</div>' + FCATS.map(function (c) {
    return '<div class="row"><label class="small" style="flex:1" for="b-' + c + '">' + esc(catName(c)) + '</label><input id="b-' + c + '" type="number" inputmode="numeric" style="width:120px" value="' + esc(F.budgets[c] || '') + '" data-in="budget" data-c="' + c + '"></div>';
  }).join('') + '<button class="btn teal" data-a="finBudgetSave">' + esc(t('save')) + '</button>';
  h += '</div><div class="card"><div class="between"><h3>' + esc(t('recT')) + '</h3><button class="link" data-a="finToggle" data-k="showRec">' + esc(F.showRec ? t('hide') : t('show')) + '</button></div>';
  if (F.showRec) h += '<div class="muted">' + esc(t('recSub')) + '</div><div class="list">' + d.recurring.map(function (x) {
    return '<div class="li"><span>' + esc(x.item || catName(x.category)) + ' <span class="muted">· ' + esc(t('recDay')) + ' ' + x.day + '</span></span><span><b>' + rs(x.amount) + '</b> <button class="link" style="color:#BE123C" data-a="finRecDel" data-id="' + x.id + '">' + esc(t('del')) + '</button></span></div>';
  }).join('') + '</div>' +
    '<input id="rItem" placeholder="' + esc(t('details')) + '" value="' + esc(r.item) + '" data-in="rItem">' +
    '<div class="row"><input id="rAmt" type="number" inputmode="decimal" placeholder="' + esc(t('amount')) + '" value="' + esc(r.amount) + '" data-in="rAmt"><input id="rDay" type="number" min="1" max="28" style="width:90px" aria-label="' + esc(t('recDay')) + '" value="' + esc(r.day) + '" data-in="rDay"></div>' +
    catSelect('rCat', r.category, 'data-ch="rCat"') + '<button class="btn" data-a="finRecAdd">' + esc(t('recAdd')) + '</button>';
  return h + '</div>';
}
function finExp(id) { var d = S.fin.data; if (!d) return null; var all = d.list.concat(d.review); for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i]; return null; }
function finUpdate(id, patch) {
  [S.fin.data.list, S.fin.data.review].forEach(function (arr) { arr.forEach(function (e) { if (e.id === id) Object.assign(e, patch); }); });
  render(); call('updateExpense', Object.assign({ id: id }, patch)).then(function () { if (!S.fin.edit) loadFin(); }).catch(fail);
}
Object.assign(H, {
  finMode: function (el) { S.fin.mode = el.dataset.m; S.fin.data = null; render(); loadFin(); },
  finNav: function (el) {
    var F = S.fin, dd = +el.dataset.d;
    if (F.mode === 'week') F.anchor = addDays(F.data ? F.data.period.start : F.anchor, 7 * dd);
    else { var p = (F.data ? F.data.period.start : F.anchor).split('-'), m = new Date(+p[0], +p[1] - 1 + dd, 1, 12); F.anchor = m.getFullYear() + '-' + pad(m.getMonth() + 1) + '-01'; }
    F.data = null; render(); loadFin();
  },
  finManual: function () { S.fin.manual = !S.fin.manual; render(); },
  finClearShots: function () { S.fin.files = []; render(); },
  finUpload: function () {
    var F = S.fin; F.busy = true; render();
    call('uploadReceipt', { images: F.files, app: F.app, date: today() }).then(function () { F.busy = false; F.files = []; F.app = ''; toast(t('uploaded')); loadFin(); })
      .catch(function (e) { F.busy = false; render(); fail(e); });
  },
  finRetry: function (el) { var F = S.fin; F.busy = true; render(); call('retryReceipt', { id: el.dataset.id }).then(function () { F.busy = false; loadFin(); }).catch(function (e) { F.busy = false; render(); fail(e); }); },
  testKey: function () {
    var k = (S.ui.set.key || '').trim();
    call('testGemini', { key: k }).then(function (r) { toast(t('keyOk') + (r.model ? ' (' + r.model + ')' : '')); }).catch(fail);
  },
  finReadNow: function () { var F = S.fin; F.busy = true; render(); call('processNow').then(function () { F.busy = false; loadFin(); }).catch(function (e) { F.busy = false; render(); fail(e); }); },
  finReviewed: function (el) {
    var src = el.dataset.r, d = S.fin.data;
    d.review = d.review.filter(function (e) { return e.source !== src; }); render();
    call('markReviewed', { receiptId: src }).then(loadFin).catch(fail);
  },
  expNeed: function (el) {
    var id = el.dataset.id, n = el.dataset.n;
    if (!id) { S.fin.form.need = n; render(); return; }
    finUpdate(id, { need: n });
  },
  fNeed: function (el) { S.fin.form.need = el.dataset.n; render(); },
  finSave: function () {
    var F = S.fin, f = F.form, amt = parseFloat(f.amount);
    if (!(amt > 0)) { document.getElementById('fAmt').focus(); return; }
    call('addExpense', { amount: amt, date: f.date, category: f.category, item: f.item, need: f.need, reason: f.need === 'avoid' ? f.reason : '', paidBy: f.paidBy || S.user, mode: f.mode })
      .then(function () { F.form = { amount: '', date: today(), category: f.category, item: '', need: 'need', reason: '', paidBy: f.paidBy, mode: f.mode }; toast(t('saved')); loadFin(); }).catch(fail);
  },
  finEdit: function (el) { S.fin.edit = S.fin.edit === el.dataset.id ? null : el.dataset.id; render(); },
  finDel: function (el) {
    var id = el.dataset.id, d = S.fin.data; d.list = d.list.filter(function (e) { return e.id !== id; }); render();
    call('deleteExpense', { id: id }).then(loadFin).catch(fail);
  },
  finAi: function () {
    var F = S.fin; F.busy = true; render();
    call('finAnalysis', { mode: F.mode, anchor: F.anchor }).then(function (d) { F.busy = false; F.data = d; render(); }).catch(function (e) { F.busy = false; render(); fail(e); });
  },
  finToggle: function (el) { S.fin[el.dataset.k] = !S.fin[el.dataset.k]; render(); },
  finBudgetSave: function () { call('saveBudgets', { budgets: S.fin.budgets }).then(function () { toast(t('saved')); loadFin(); }).catch(fail); },
  finRecAdd: function () {
    var r = S.fin.rec; if (!(parseFloat(r.amount) > 0)) return;
    call('addRecurring', { item: r.item, amount: r.amount, day: r.day, category: r.category }).then(function () { S.fin.rec = { item: '', amount: '', day: '1', category: r.category }; loadFin(); }).catch(fail);
  },
  finRecDel: function (el) { call('deleteRecurring', { id: el.dataset.id }).then(loadFin).catch(fail); }
});
Object.assign(IN, {
  fAmt: function (el) { S.fin.form.amount = el.value; }, fItem: function (el) { S.fin.form.item = el.value; }, fReason: function (el) { S.fin.form.reason = el.value; },
  budget: function (el) { S.fin.budgets[el.dataset.c] = el.value; },
  rItem: function (el) { S.fin.rec.item = el.value; }, rAmt: function (el) { S.fin.rec.amount = el.value; }, rDay: function (el) { S.fin.rec.day = el.value; }
});
Object.assign(CH, {
  fDate: function (el) { S.fin.form.date = el.value; }, fCat: function (el) { S.fin.form.category = el.value; },
  fPaid: function (el) { S.fin.form.paidBy = el.value; }, fMode: function (el) { S.fin.form.mode = el.value; },
  rCat: function (el) { S.fin.rec.category = el.value; },
  finApp: function (el) { S.fin.app = el.value; },
  expCat: function (el) { finUpdate(el.dataset.id, { category: el.value }); },
  expReason: function (el) { finUpdate(el.dataset.id, { reason: el.value }); },
  finShots: function (el) {
    var files = Array.prototype.slice.call(el.files || [], 0, 6), out = [], F = S.fin;
    if (!files.length) return;
    files.forEach(function (f, i) { shrinkImage(f, 1600, function (u) { out[i] = u; if (out.filter(Boolean).length === files.length) { F.files = out; render(); } }); });
  }
});

// ------------------------------------------------------------------ events
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  var fn = H[el.dataset.a]; if (fn) fn(el, e);
});
document.addEventListener('input', function (e) { var el = e.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el); });
document.addEventListener('change', function (e) { var el = e.target.closest('[data-ch]'); if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el); });

// long-press on a task row opens one-thing-now; swipe inside focus card moves between tasks
var lp = { timer: null, x: 0, y: 0, el: null }, sw = { x: null };
document.addEventListener('pointerdown', function (e) {
  var f = e.target.closest('[data-swipe]');
  if (f) { sw.x = e.target.closest('input,select,textarea,button') ? null : e.clientX; return; }
  var row = e.target.closest('[data-lp]');
  if (!row || S.view !== S.user || e.target.closest('button,input,select,textarea,label')) return;
  lp.x = e.clientX; lp.y = e.clientY; lp.el = row; row.classList.add('press');
  lp.timer = setTimeout(function () {
    row.classList.remove('press'); lp.el = null;
    S.ui.focus = +row.dataset.lp; S.ui.sheet = null; render();
    if (navigator.vibrate) try { navigator.vibrate(20); } catch (x) {}
  }, 650);
});
function lpCancel() { clearTimeout(lp.timer); if (lp.el) lp.el.classList.remove('press'); lp.el = null; }
document.addEventListener('pointermove', function (e) { if (lp.el && (Math.abs(e.clientX - lp.x) > 10 || Math.abs(e.clientY - lp.y) > 10)) lpCancel(); });
document.addEventListener('pointerup', function (e) {
  lpCancel();
  if (sw.x !== null && S.ui.focus !== null) { var dx = e.clientX - sw.x; sw.x = null; if (dx < -50) goFocus(1); else if (dx > 50) goFocus(-1); }
});
document.addEventListener('pointercancel', lpCancel);
document.addEventListener('contextmenu', function (e) { if (e.target.closest('[data-lp]')) e.preventDefault(); });

// ------------------------------------------------------------------ start
window.SP = { S: S, H: H, render: render };
if (S.token) startApp(); else render();
})();
</script>

name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point Gradle to the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          URL="https://${OWNER}.github.io/${{ github.event.repository.name }}/"
          echo "App opens: $URL"
          gradle -p android assembleRelease --no-daemon -PappUrl="$URL" -PversionCode=${{ github.run_number }}

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ShloksParents.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ShloksParents.apk \
            --title "Shlok's Parents for Android (build ${{ github.run_number }})" \
            --notes "On the Android phone: open this page, tap ShloksParents.apk, then Install."
